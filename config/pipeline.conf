[kafka]
bootstrap_servers = kafka:9092
topic = cold-chain-telemetry

[spark]
sql_extensions = io.delta.sql.DeltaSparkSessionExtension
catalog_class = org.apache.spark.sql.delta.catalog.DeltaCatalog
checkpoint_bronze = /tmp/spark-checkpoints/bronze
checkpoint_silver = /tmp/spark-checkpoints/silver
checkpoint_gold = /tmp/spark-checkpoints/gold

[tables]
bronze = db.bronze_telemetry
silver = db.silver_telemetry
gold = db.gold_telemetry_agg

[fleet]
num_trucks = 5
