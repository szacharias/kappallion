[project]
name = "cold-chain-lakehouse"
version = "0.2.0"
description = "Real-time Cold-Chain IoT Lakehouse Platform using Kafka, Spark Structured Streaming, and Delta Lake"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.0.0",
    "kafka-python-ng>=2.2.0",
    "streamlit>=1.30.0",
    "pydeck>=0.8.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "urllib3>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import order)
    "B",      # flake8-bugbear (bug prevention & design pitfalls)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern python syntax)
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line-too-long (handled by ruff format)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --durations=10"
markers = [
    "unit: fast isolated unit tests with zero external dependencies",
    "integration: tests requiring external containers or network services",
    "slow: tests taking longer than 2 seconds to complete"
]
pythonpath = [
    ".",
    "apps/core",
    "apps/pipelines",
    "docker/simulator",
    "docker/dashboard"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
